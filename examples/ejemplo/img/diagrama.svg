<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" font-family="Segoe UI, system-ui, sans-serif">
  <!-- Cómo funciona Pluma: archivo → bloques → vista / edición. Colores medios para leerse en claro y oscuro. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#8a8fa8"/>
    </marker>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <g stroke="#8a8fa8" stroke-width="1.5" fill="none">
    <rect x="10" y="55" width="130" height="60" rx="10"/>
    <rect x="255" y="55" width="130" height="60" rx="10" stroke="url(#ink)" stroke-width="2.5"/>
    <rect x="500" y="15" width="130" height="50" rx="10"/>
    <rect x="500" y="105" width="130" height="50" rx="10"/>
    <path d="M140 85H250" marker-end="url(#arrow)"/>
    <path d="M385 75C440 75 445 40 495 40" marker-end="url(#arrow)"/>
    <path d="M385 95C440 95 445 130 495 130" marker-end="url(#arrow)"/>
  </g>

  <g fill="#8a8fa8" font-size="15" text-anchor="middle">
    <text x="75" y="81">archivo .md</text>
    <text x="75" y="101" font-size="12">en disco</text>
    <text x="320" y="81">bloques</text>
    <text x="320" y="101" font-size="12">párrafo, lista, tabla…</text>
    <text x="565" y="45">vista HTML</text>
    <text x="565" y="135">edición (textarea)</text>
    <text x="195" y="75" font-size="12">marked.lexer</text>
    <text x="445" y="155" font-size="12">clic / foco</text>
  </g>
</svg>
