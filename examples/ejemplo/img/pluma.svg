<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Pluma: una pluma geométrica cuyas barbas son pistas de circuito. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e2638"/>
      <stop offset="1" stop-color="#0d111b"/>
    </linearGradient>
    <!-- userSpaceOnUse: el degradado recorre la pluma de la punta al extremo -->
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="512" y1="900" x2="512" y2="120">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>

  <g transform="rotate(40 512 512)">
    <!-- Vane asimétrica con la muesca típica de una pluma (lado derecho) -->
    <path fill="url(#ink)" d="
      M512 120
      C 604 186 646 318 636 428
      L 574 466
      L 628 500
      C 616 604 574 664 512 724
      C 468 672 438 600 430 500
      C 422 356 448 214 512 120 Z"/>

    <!-- Raquis + barbas como pistas recortadas, con nodos en los extremos -->
    <g stroke="#111726" stroke-width="18" stroke-linecap="round" fill="none">
      <path d="M512 200 V 724"/>
      <path d="M512 352 L 584 292"/>
      <path d="M512 586 L 580 526"/>
      <path d="M512 440 L 462 390"/>
      <path d="M512 620 L 470 578"/>
    </g>
    <g fill="#111726">
      <circle cx="584" cy="292" r="19"/>
      <circle cx="580" cy="526" r="19"/>
      <circle cx="462" cy="390" r="19"/>
      <circle cx="470" cy="578" r="19"/>
    </g>

    <!-- Cálamo con punta de escritura -->
    <path fill="url(#ink)" d="M500 716 H 524 L 524 868 L 512 904 L 500 868 Z"/>
  </g>
</svg>
